<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drone video to 3D</title>
<style>body{font:16px system-ui;background:#101720;color:#eef3f9;margin:0}main{max-width:760px;margin:40px auto;padding:24px}h1{font-size:30px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:grid;gap:7px}input,button,select{font:inherit;padding:12px;border:1px solid #526174;border-radius:8px;background:#1c2838;color:inherit}small{color:#b6c4d4}.wide{grid-column:1/-1}button{background:#2867c7;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#1c2838;border-radius:8px}a{color:#8fc0ff}progress{width:100%}@media(max-width:500px){form{grid-template-columns:1fr}.wide{grid-column:auto}}</style>
<main><h1>Fly-By Render</h1><p>Choose your settings and build a 3D Reconstruction.</p>
<form id="form">
<label class="wide">Input video<input name="video" type="file" accept="video/*,.mkv,.avi,.mov,.mp4" required></label>
<label>Training steps<input name="steps" type="number" value="2000" min="1" max="1000000" required><small>Steps improves the general quality and detail level.</small></label>
<label>Keep every Nth frame<input name="every" type="number" value="5" min="1" max="100000" required><small>Lower values require higher processing.</small></label>
<label>Maximum width<input name="max-width" type="number" value="1920" min="0" max="16384" required><small>Input width limit. With SR, training images are twice this width; start with 640 on a 6 GB GPU.</small></label>
<label>Output folder<input name="output" required pattern="runs/.+"><small>Folder contains capture images, colmap data, and model.</small></label>
<label>Brightness<input name="brightness" type="number" value="0" min="-255" max="255" step="any" required><small>Additive pixel offset</small></label>
<label>Contrast<input name="contrast" type="number" value="1" min="0" max="10" step="any" required><small>Contrast multiplier</small></label>
<label>CAS-Effectiveness<input name="sharpness" type="number" value="0.5" min="0" max="1" step="any" required><small>CAS sharpening multiplier</small></label>
<label>Unsharp masking<select name="unsharp"><option value="auto">Automatic (off with SR)</option><option value="off">Off</option><option value="on">On</option></select><small>CAS remains active. Extra sharpening can amplify noise.</small></label>
<label class="wide">Super-resolution<select name="super-resolution" id="sr-mode"><option value="false">Off — existing pipeline</option><option value="true">On — SwinIR 2× + CAS</option></select><small>Uses one camera per training step and preserves brightness/contrast. Requires SwinIR setup on the server.</small></label>
<label>SR tile size<input name="sr-tile" type="number" value="128" min="32" max="512" step="8" disabled required><small>Smaller tiles use less GPU memory.</small></label>
<label>Enhanced-image weight<input name="sr-prior-weight" type="number" value="0.5" min="0" max="1" step="0.05" disabled required><small>The remaining weight keeps downsampled renders close to the base images.</small></label>
<button class="wide" id="build">Upload & build</button></form>
<p id="upload"></p><progress id="progress" max="100" value="0" hidden></progress>
<h2>Current activity</h2><div id="status" role="status" aria-live="polite">Ready to upload!</div>
<p><small>Keep this page open to launch the viewer automatically.</small></p></main>
<p><a id="viewer" target="_blank" rel="noopener" hidden>Or click here to open viewer</a></p>
<script>
const form=document.querySelector('#form'),statusBox=document.querySelector('#status'),build=document.querySelector('#build'),link=document.querySelector('#viewer');
form.elements.output.value='runs/web-'+new Date().toISOString().replace(/[:.]/g,'-');
const viewerURL=new URL(location.href);viewerURL.port='8000';viewerURL.pathname='/';viewerURL.search='';viewerURL.hash='';link.href=viewerURL.href;
form.elements['super-resolution'].onchange=()=>{const enabled=form.elements['super-resolution'].value==='true';for(const key of ['sr-tile','sr-prior-weight'])form.elements[key].disabled=!enabled;};
let submitted=false,navigated=false,uploading=false,completionHandled=false;
async function poll(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();statusBox.textContent=s.status;build.disabled=uploading||s.busy;link.hidden=!s.viewer;if(submitted&&!uploading&&!s.busy&&s.saved&&!completionHandled){completionHandled=true;form.elements.output.value='runs/web-'+new Date().toISOString().replace(/[:.]/g,'-');document.querySelector('#upload').textContent='Model saved. Ready for another upload; the viewer remains open.';}if(submitted&&!uploading&&s.viewer&&!navigated){navigated=true;const tab=window.open(viewerURL.href,'_blank');if(tab){tab.opener=null;}else{link.textContent='Viewer ready — click here to open (automatic tab was blocked)';}}}catch{statusBox.textContent='Cannot reach the upload server. Check the terminal.';}setTimeout(poll,700);}poll();
form.onsubmit=e=>{e.preventDefault();if(uploading)return;const file=form.elements.video.files[0];if(!file)return;const params=new URLSearchParams();for(const key of ['steps','every','max-width','output','brightness','contrast','sharpness','super-resolution','unsharp'])params.set(key,form.elements[key].value);if(form.elements['super-resolution'].value==='true'){for(const key of ['sr-tile','sr-prior-weight'])params.set(key,form.elements[key].value);}

 submitted=false;navigated=false;link.textContent='Open viewer';completionHandled=false;uploading=true;build.disabled=true;const progress=document.querySelector('#progress'),label=document.querySelector('#upload');progress.hidden=false;
 const xhr=new XMLHttpRequest();xhr.open('POST','/upload?'+params);xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.upload.onprogress=e=>{if(e.lengthComputable){progress.value=100*e.loaded/e.total;label.textContent='Uploading: '+progress.value.toFixed(1)+'%';}};
 xhr.onload=()=>{uploading=false;if(xhr.status===202){submitted=true;label.textContent='Upload complete. Processing video…';}else{let message='Upload failed';try{message=JSON.parse(xhr.responseText).error||message;}catch{}label.textContent=message;build.disabled=false;submitted=false;}};
 xhr.onerror=()=>{uploading=false;submitted=false;build.disabled=false;label.textContent='Upload connection failed.';};xhr.send(file);
};
</script></html>
