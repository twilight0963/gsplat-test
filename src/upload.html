<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drone video to 3D</title>
<style>body{font:16px system-ui;background:#101720;color:#eef3f9;margin:0}main{max-width:760px;margin:40px auto;padding:24px}h1{font-size:30px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:grid;gap:7px}input,button{font:inherit;padding:12px;border:1px solid #526174;border-radius:8px;background:#1c2838;color:inherit}small{color:#b6c4d4}.wide{grid-column:1/-1}button{background:#2867c7;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#1c2838;border-radius:8px}a{color:#8fc0ff}progress{width:100%}@media(max-width:500px){form{grid-template-columns:1fr}.wide{grid-column:auto}}</style>
<main><h1>Fly-By Render</h1><p>Choose your settings and build a 3D Reconstruction.</p>
<form id="form">
<label class="wide">Input video<input name="video" type="file" accept="video/*,.mkv,.avi,.mov,.mp4" required></label>
<label>Training steps<input name="steps" type="number" value="2000" min="1" max="1000000" required><small>Steps improves the general quality and detail level.</small></label>
<label>Keep every Nth frame<input name="every" type="number" value="5" min="1" max="100000" required><small>Lower values require higher processing.</small></label>
<label>Maximum width<input name="max-width" type="number" value="1920" min="0" max="16384" required><small>Maximum resolution.</small></label>
<label>Output folder<input name="output" required pattern="runs/.+"><small>Folder contains capture images, colmap data, and model.</small></label>
<label>Brightness<input name="brightness" type="number" value="1" min="-255" max="255" step="any" required><small>Brightness multiplier</small></label>
<label>Contrast<input name="contrast" type="number" value="1" min="0" max="10" step="any" required><small>Contrast multiplier</small></label>
<label>CAS-Effectiveness<input name="sharpness" type="number" value="0.5" min="0" max="1" step="any" required><small>CAS sharpening multiplier</small></label>
<button class="wide" id="build">Upload & build</button></form>
<p id="upload"></p><progress id="progress" max="100" value="0" hidden></progress>
<h2>Current activity</h2><div id="status" role="status" aria-live="polite">Ready to upload!</div>
<p><small>Keep this page open to launch the viewer automatically.</small></p></main>
<p><a id="viewer" target="_blank" rel="noopener" hidden>Or click here to open viewer</a></p>
<script>
const form=document.querySelector('#form'),statusBox=document.querySelector('#status'),build=document.querySelector('#build'),link=document.querySelector('#viewer');
form.elements.output.value='runs/web-'+new Date().toISOString().replace(/[:.]/g,'-');
const viewerURL=new URL(location.href);viewerURL.port='8000';viewerURL.pathname='/';viewerURL.search='';viewerURL.hash='';link.href=viewerURL.href;
let tab=null,submitted=false,navigated=false,uploading=false;
async function poll(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json();statusBox.textContent=s.status;build.disabled=uploading||s.busy;link.hidden=!s.viewer;if(submitted&&s.viewer&&!navigated){if(tab&&!tab.closed)tab.location.replace(viewerURL.href);navigated=true;}if(submitted&&!uploading&&!s.busy&&!s.viewer&&tab&&!tab.closed&&!navigated)tab.close();}catch{statusBox.textContent='Cannot reach the upload server. Check the terminal.';}setTimeout(poll,700);}poll();
form.onsubmit=e=>{e.preventDefault();if(uploading)return;const file=form.elements.video.files[0];if(!file)return;const params=new URLSearchParams();for(const key of ['steps','every','max-width','output','brightness','contrast','sharpness'])params.set(key,form.elements[key].value);
 tab=window.open('about:blank','drone-model-viewer');if(tab){tab.document.title='Waiting for training';tab.document.body.textContent='The viewer will open here when splat training starts. You can return to the upload tab to follow progress.';}
 submitted=true;navigated=false;uploading=true;build.disabled=true;const progress=document.querySelector('#progress'),label=document.querySelector('#upload');progress.hidden=false;
 const xhr=new XMLHttpRequest();xhr.open('POST','/upload?'+params);xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.upload.onprogress=e=>{if(e.lengthComputable){progress.value=100*e.loaded/e.total;label.textContent='Uploading: '+progress.value.toFixed(1)+'%';}};
 xhr.onload=()=>{uploading=false;if(xhr.status===202){label.textContent='Upload complete. Processing video…';}else{let message='Upload failed';try{message=JSON.parse(xhr.responseText).error||message;}catch{}label.textContent=message;build.disabled=false;submitted=false;if(tab&&!tab.closed)tab.close();}};
 xhr.onerror=()=>{uploading=false;submitted=false;build.disabled=false;label.textContent='Upload connection failed.';if(tab&&!tab.closed)tab.close();};xhr.send(file);
};
</script></html>
